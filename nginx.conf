server {
  listen 5000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Di belakang reverse proxy: jangan buat redirect absolut ke host:5000
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Aset ber-hash dari Vite: aman di-cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html jangan di-cache agar deploy baru langsung terambil
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback untuk TanStack Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
